name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-project:
    name: Validate project file
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify branch protection guide
        run: grep -q '^# Branch Protection Practice$' branch-protection-demo.md
